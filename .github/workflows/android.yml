name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          yes | sdkmanager --licenses > /dev/null || true

      - name: Install dependencies
        run: npm install

      - name: Build web bundle
        env:
          WEB_VERSION: ${{ github.run_number }}
        run: npm run build:web

      - name: Add Android platform
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Ensure stable debug signing key
        run: |
          if [ ! -f signing/debug.keystore ]; then
            mkdir -p signing
            keytool -genkeypair -v \
              -keystore signing/debug.keystore \
              -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add signing/debug.keystore
            git commit -m "chore: add stable Android debug signing key [skip ci]"
            git push || echo "::warning::Could not push the signing key; future builds may use a different key."
          fi
          mkdir -p ~/.android
          cp signing/debug.keystore ~/.android/debug.keystore

      - name: Read native version
        run: echo "NATIVE_VERSION=$(jq -r .versionName native-version.json)" >> $GITHUB_ENV

      - name: Set Android version
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"$NATIVE_VERSION\"/" android/app/build.gradle

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare release files
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk shah-saab-debug.apk
          (cd www && zip -r ../www.zip .)
          WEB_SHA=$(sha256sum www.zip | awk '{print $1}')
          cat > latest.json <<EOF
          {
            "versionCode": ${{ github.run_number }},
            "versionName": "$NATIVE_VERSION",
            "nativeVersionName": "$NATIVE_VERSION",
            "webVersion": ${{ github.run_number }},
            "webChecksum": "$WEB_SHA",
            "apkUrl": "https://github.com/${{ github.repository }}/releases/download/build-${{ github.run_number }}/shah-saab-debug.apk",
            "wwwUrl": "https://github.com/${{ github.repository }}/releases/download/build-${{ github.run_number }}/www.zip",
            "publishedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: shah-saab-debug-apk
          path: shah-saab-debug.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Shah Saab build ${{ github.run_number }}
          files: |
            shah-saab-debug.apk
            www.zip
            latest.json
          draft: false
          prerelease: false

      - name: Publish update manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan update-manifest-${{ github.run_number }}
          git rm -rf . > /dev/null 2>&1 || true
          cp latest.json .
          git add latest.json
          git commit -m "Update manifest for build ${{ github.run_number }}"
          git push --force origin HEAD:updates
